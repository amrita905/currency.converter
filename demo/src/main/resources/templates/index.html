<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Currency Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: "Poppins", system-ui, sans-serif;
            background: radial-gradient(circle at top, #1a1a2e, #0f0c29);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            perspective: 1200px;
        }

        .card {
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            box-shadow:
                    0 30px 60px rgba(0, 0, 0, 0.6),
                    inset 0 0 30px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }

        .card:hover {
            transform: rotateX(6deg) rotateY(-6deg) scale(1.02);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            opacity: 0.85;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 15px;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 12px 30px rgba(118, 75, 162, 0.6);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(118, 75, 162, 0.8);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.25),
                    rgba(255, 255, 255, 0.05)
            );
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.15);
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.4s ease;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .loading {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>💱 Currency Converter</h2>

    <div class="field">
        <label>From Currency</label>
        <input id="from" placeholder="USD">
    </div>

    <div class="field">
        <label>To Currency</label>
        <input id="to" placeholder="INR">
    </div>

    <button onclick="convert()">Convert</button>

    <div id="result" class="result"></div>

    <div class="footer">Spring Boot • REST API</div>
</div>

<script>
    function convert() {
        const from = document.getElementById("from").value.trim().toUpperCase();
        const to = document.getElementById("to").value.trim().toUpperCase();
        const result = document.getElementById("result");

        if (!from || !to) {
            showResult("⚠️ Enter both currencies");
            return;
        }

        result.classList.remove("show");
        result.classList.add("loading");
        result.innerText = "Fetching exchange rate...";

        fetch(`/exchange?from=${from}&to=${to}`)
            .then(res => {
                if (!res.ok) throw new Error("API error");
                return res.json();
            })
            .then(data => {
                showResult(`✨ 1 ${from} = ${data.rate} ${to}`);
            })
            .catch(() => {
                showResult("❌ Invalid currency or server error");
            });
    }

    function showResult(text) {
        const result = document.getElementById("result");
        result.classList.remove("loading");
        result.innerText = text;
        setTimeout(() => result.classList.add("show"), 50);
    }
</script>

</body>
</html>
